          description: Job title match to profile target role 0-100
        skillScore:
          type: integer
          description: Skill match score 0-100
        experienceScore:
          type: integer
          description: Experience level match score 0-100

    SavedJob:
      type: object
      required: [id, jobId, savedAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        savedAt:
          type: string
        job:
          $ref: "#/components/schemas/Job"

    SavedJobInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: integer

    JobStats:
      type: object
      required: [totalJobs, totalSources, topSkills, jobTypeBreakdown, categoryBreakdown]
      properties:
        totalJobs:
          type: integer
        totalSources:
          type: integer
        avgFitScore:
          type: ["integer", "null"]
        topSkills:
          type: array
          items:
            type: object
            required: [skill, count]
            properties:
              skill:
                type: string
              count:
                type: integer
        jobTypeBreakdown:
          type: array
          items:
            type: object
            required: [jobType, count]
            properties:
              jobType:
                type: string
              count:
                type: integer
        categoryBreakdown:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer

    ScrapeRequest:
      type: object
      properties:
        keywords:
          type: string
        location:
          type: string

    ScrapeResult:
      type: object
      required: [jobsAdded, jobsUpdated, total]
      properties:
        jobsAdded:
          type: integer
        jobsUpdated:
          type: integer
        total:
          type: integer
        message:
          type: string

    PremiumPaymentInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [monthly, annual]

    PremiumPayment:
      type: object
      required: [id, plan, amount, status, checkoutUrl, purchaseReference, environment]
      properties:
        id:
          type: integer
        plan:
          type: string
          enum: [monthly, annual]
        amount:
          type: integer
        status:
          type: string
        checkoutUrl:
          type: string
          format: uri
        purchaseReference:
          type: string
        paymentLinkExpiresAt:
          type: ["string", "null"]
        environment:
          type: string
          enum: [sandbox, live]
        sandboxTestPhone:
          type: ["string", "null"]

    PremiumPaymentStatus:
      type: object
      required: [id, status, isPremium]
      properties:
        id:
          type: integer
        status:
          type: string
        isPremium:
          type: boolean
        premiumUntil:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        message:
          type: string
